<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="login_account.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    
    <header>
        <nav id="navbar">
            <h2 id="logo">
                <a href="/index.html" id="logo-text">OFFLINE</a>
            </h2>
            <ul>
                <li><a href="/Create_account/Create_account.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>    

    <div class="login-container">
        <div id="login-Account">
            <h2>Welcome back</h2>
            <p id="info">Login to continue</p>
        </div>        
        <label for="username">
            Username 
            <input id="username" type="email" placeholder="Enter username..."/></i>
        </label>
        <label for="password">
            Password Abcdef1!
            <span id="password-eye-container">
                <input id="password" type="password" placeholder="Enter password..."/><i class="fa-solid fa-eye" id="reveal-pw"></i>
            </span>
        </label>
        <button id="login">Log in</button>        
        <button id="recover-user">Recover User</button>
        <span id="no-account-container">
            <p>Don't have an account?</p>
            <a href="/Create_account/Create_account.html">Create one</a>
        </span>
    </div>

    <div id="modal" class="modal-overlay">
            <div class="modal-box">
                <button id="closeBtn" class="modal-close">×</button>
                <label id="recovery-email-wrapper">
                    Input Email Address: 
                        <input id="email-address-recovery"/>
                        <button id="recovery-email-user-btn">Recover User</button>
                        <p id="recovery-user-msg"></p>
                </label>
            </div>
    </div>


    <footer>
            <h3>© 2026 Offline</h3>
            <div class="social-icons">
                <a href="https://facebook.com/yourpage" target="_blank" rel="noopener" aria-label="Facebook">
                    <i class="fa-brands fa-facebook"></i>
                </a>
                <a href="https://twitter.com/yourhandle" target="_blank" rel="noopener" aria-label="Twitter">
                    <i class="fa-brands fa-x-twitter"></i>
                </a>
                <a href="https://instagram.com/yourhandle" target="_blank" rel="noopener" aria-label="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a href="https://linkedin.com/company/yourcompany" target="_blank" rel="noopener" aria-label="LinkedIn">
                    <i class="fa-brands fa-linkedin"></i>
                </a>
                <a href="https://youtube.com/yourchannel" target="_blank" rel="noopener" aria-label="YouTube">
                    <i class="fa-brands fa-youtube"></i>
                </a>
            </div>
    </footer>

    <script src="login-account.js"></script>
</body>
</html>
