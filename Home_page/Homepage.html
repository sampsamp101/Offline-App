<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Homepage</title>
    <link rel="stylesheet" href="Homepage.css">
</head>
<body>
    <main>
        <nav id="navbar">
            <h2 id="logo">
                OFFLINE
            </h2>
              <li><a href="Homepage.html" id="home-chat">Home</a></li>
            <label for="searchFilter">
                Search User Messages
              <input id="searchFilter" type="text"/>
            </label>
            <ul>
              <li><p>Welcome</p></li>
              <li><p id="username"></p></li>
              <li><a href="/login_account/login-account.html" id="log-out">Log out</a></li>
            </ul>
        </nav>
        <div class="outer-container">
            <div class="inner-container">
                <div id="message-wrapper">
                </div>
                <div id="add-remove-contacts-wrapper">
                    <div id="contacts-wrapper">
                    </div>
                    <div id="current-contacts-wrapper">
                        <button class="button" id="add-contact-list">Add all contacts</button>
                        <button class="button" id="add">Add Contacts</button>
                        <div id="input-outcome-wrapper">
                            <input id="search-function" type="text"/>
                            <p id="warning-msg"></p>
                        </div>
                        <button class="button" id="remove">Remove Contacts</button>
                        <button class="button" id="clear-localStorage">Clear Local Storage and messages</button>
                    </div>    
                 </div>
            </div>
        </div>
    </main>
    <!-- Link external JavaScript file here -->
    <script src="Homepage.js"></script>
</body>
</html>
