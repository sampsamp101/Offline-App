<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Title</title>
    <link rel="stylesheet" href="chatbox.css">
</head>
<body>
    <main> 
        <nav id="navbar">
            <h2 id="logo">
                OFFLINE
            </h2>
             <li><a href="/Home_page/Homepage.html" id="home-chat">Home</a></li>
            <ul>
             <li>Welcome <span id="username"></span></li>
              <li><a href="/login_account/login-account.html">Log out</a></li>
            </ul>
        </nav>
        <div class="outer-container">
            <div class="inner-container">
                <div class ="top-header">
                    <div class ="name" id="chat-with">
                    </div>
                </div> 
                <div id = "message-wrapper">
            </div>
            <div id ="message-wrapper-container">
                <div id="left-input-wrapper">    
                 <input
                        type="text"
                        id="message-send"
                        class="input"
                        placeholder="Key in your desired chat"
                    >
                    <button class="button" id="send-msg-btn">Send</button>
                    <button class="button" id="clear">clear Messages</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Link external JavaScript file here -->
    <script src="chatbox.js"></script>
</body>
</html>
